<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>
  <!-- Glass cube rotated 45 degrees (rhombus) -->
  <g transform="translate(256, 256) rotate(45)">
    <!-- Main glass body -->
    <rect x="-140" y="-140" width="280" height="280" rx="40" ry="40" fill="url(#glassGradient)" />
    <!-- Highlight reflection -->
    <rect x="-120" y="-120" width="100" height="60" rx="20" ry="20" fill="url(#highlight)" />
  </g>
</svg>
